[package]
name = "easyreaktoro"
version = "0.16.0"
license = "MIT"
description = "EasyReaktoro thermodynamic database workbench"
authors = ["EasyReaktoro"]
edition = "2021"

[lib]
name = "easyreaktoro_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2.7.2"
rusqlite = { version = "0.32", features = ["bundled"] }

[features]
custom-protocol = ["tauri/custom-protocol"]

[patch.crates-io]
rfd = { path = "vendor/rfd" }
