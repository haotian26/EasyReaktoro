 for(const f of files){const text=await fileText(f);sources.push({name:f.name,size:f.size,last_modified:new Date(f.lastModified).toISOString()});
  if(/\.html?$/i.test(f.name)){
   // Extract only the inert payload; never evaluate scripts from an imported HTML.
   const match=text.match(/<script\b([^>]*\bid=["']payload["'][^>]*)>([\s\S]*?)<\/script\s*>/i),encoding=match?.[1].match(/data-encoding=["']([^"']+)["']/i)?.[1]||'json';
   if(!match||!match[2].trim())throw new Error(L('此 HTML 不含已保存的结果数据。','This HTML does not contain saved result data.'));
   if(standalone)throw new Error(L('请一次只打开一个工作区。','Open one workspace at a time.'));standalone=await decodePayload(match[2],encoding);continue;
  }
  if(f.name.toLowerCase().endsWith('.json')){const p=JSON.parse(text);if(!object(p))throw new Error(L('文件内容无法识别，请选择结果文件或配套的数据说明文件。','Select a result file or its data description file.'));if(p.format==='result-explorer-1'){if(standalone)throw new Error(L('一次只能打开一组 JSON 结果。','Open one Explorer JSON result at a time.'));standalone=p;}else{if(Object.keys(metadata).length)throw new Error(L('每次只选择一份配套的数据说明文件。','Select only one data description file.'));metadata=p;}continue;}
  const t=parseCSV(text);
  if(/^transfers?\.csv(?:\.gz)?$/i.test(f.name)||['rule','source','fraction','species'].every(k=>t.columns.includes(k)))throw new Error(L('此文件记录反应前的物料转移，不是平衡后的物种结果。请选择水相、矿物或气相结果表：','This file records material transfers before reaction, not equilibrium species. Choose aqueous, mineral or gas result tables: ')+f.name);
  if(/failure|audit|balance/i.test(f.name))throw new Error(L('此文件不是状态汇总或物种表：','Not a state summary or species table: ')+f.name);
  if(t.columns.includes('species'))species.push(t);else{if(summary)throw new Error(L('请选择一个状态汇总文件。','Select only one state summary.'));summary=t;}
 }
 if(standalone){if(files.length!==1)throw new Error(L('工作区 / JSON 自带全部表，请单独打开。','Workspace / JSON contains all tables; open it alone.'));return standalone;}
 if(!summary)throw new Error(L('缺少状态汇总 CSV。','Missing state summary CSV.'));
 const split=id=>$(id).value.split(',').map(s=>s.trim()).filter(Boolean),keys=split('custom-keys'),dims=split('custom-dimensions');
 return {format:'result-explorer-1',name:files.find(f=>/summary/i.test(f.name))?.name||files[0].name,summary,species_tables:species,metadata,sources,...(keys.length?{key_columns:keys}:{}),...(dims.length?{dimension_columns:dims}:{})};
}
async function encodePayload(payload){const text=JSON.stringify(payload);if(!globalThis.CompressionStream)return {encoding:'json',text};const compressed=new Uint8Array(await new Response(new Blob([text]).stream().pipeThrough(new CompressionStream('gzip'))).arrayBuffer());let binary='';for(let i=0;i<compressed.length;i+=32768)binary+=String.fromCharCode(...compressed.subarray(i,i+32768));return {encoding:'gzip-base64',text:btoa(binary)};}
async function saveWorkspace(){
 stop();const b=$('save-confirm');b.disabled=true;b.textContent=L('打包中…','Packing…');
 try{state.language=language;const scope=workspaceScope(),view=copy(state),filename=safeName($('workspace-filename').value,'html'),encoded=await encodePayload({...rawPayload,metadata:{...(object(rawPayload.metadata)?rawPayload.metadata:{}),workspace_scope:scope},view}),clone=document.documentElement.cloneNode(true),node=clone.querySelector('#payload');
  node.dataset.encoding=encoded.encoding;node.textContent=encoded.text.replace(/</g,'\\u003c');clone.querySelector('#app').innerHTML='';clone.querySelector('#loading').classList.remove('hide');clone.querySelector('#toast').innerHTML='';clone.querySelector('#toast').classList.add('hide');clone.querySelector('#curve-tooltip').innerHTML='';clone.querySelector('#curve-tooltip').classList.add('hide');
  const saved=await download(new Blob(['<!doctype html>\n'+clone.outerHTML],{type:'text/html;charset=utf-8'}),filename);if(saved===false)return;$('save-dialog').close();toast(L('已保存工作区：','Saved workspace: ')+workspaceScopeLabel(scope)+L('；包含全部载入数据和图表设置。','; includes all loaded data and figure settings.'));
 }catch(e){toast(L('保存失败：','Save failed: ')+e.message);}finally{b.disabled=false;b.textContent=L('下载 HTML','Download HTML');}
}

const notebookCode = `from pathlib import Path
import json, math

def explorer_table(frame):
    def clean(value):
        if hasattr(value, "item"):
            value = value.item()
        if value is None or (isinstance(value, float) and not math.isfinite(value)):
            return None
        if isinstance(value, (str, int, float, bool)):
            return value
        return str(value)
    return {
        "columns": [str(c) for c in frame.columns],
        "rows": [[clean(v) for v in row]
                 for row in frame.itertuples(index=False, name=None)],
    }

# Replace these variable names with your existing result DataFrames.
payload = {
    "format": "result-explorer-1",
    "name": "Simulation results",
    "summary": explorer_table(summary_df),
    "species_tables": [explorer_table(species_results_df)],
    # For separate phase tables, include both in species_tables.
    # Optional: "key_columns": ["cycle", "step"],
    # Optional: "dimension_columns": ["reaction_progress"],
}
output = Path("results/explorer_results.json")
output.parent.mkdir(parents=True, exist_ok=True)
# Exclusive creation: change the filename if it already exists.
with output.open("x", encoding="utf-8") as handle:
    json.dump(payload, handle, ensure_ascii=False, allow_nan=False)
print(output.resolve())`;

 $('help-content').innerHTML=`<p>${L('① <strong>添加图：</strong>每张图有自己的 species、数值类型和状态量。点击图内任意位置即可选中；在该图的“图设置”中选择叠加或分行。叠加时每个量使用独立且标明单位的纵轴。','① <strong>Add figures:</strong> each has independent species, quantity and state selections. Click anywhere in a figure to select it. Choose overlay or separate lanes in that figure’s settings; overlays give every quantity its own labelled axis.')}</p><p>${L('<strong>横轴与采样顺序：</strong>可用 pH、系统状态或物种数值作为横轴；“沿…比较”决定每条曲线包含哪些采样点。横纵轴始终配对同一个状态点，按采样顺序连线，允许回折和相同横轴值。此时图内播放与 Δ 都按该采样顺序，不会把重复值合并。<br><strong>横轴方向：</strong>在顶部选择“小 → 大”或“大 → 小”，所有图的曲线、刻度与悬停随之改变显示方向，不改变数据、当前点或纵轴范围。使用温度、压力等条件横轴时，左右键与细进度条也按屏幕方向移动，Δ 比较相邻较小横轴值；使用数值横轴时，采样顺序保持不变。指定参考点后，Δ 改为与该点比较。条件播放顺序独立设置。方向会保存在工作区中，并用于 SVG 导出。','<strong>X quantities and sample order:</strong> use pH, another system value or a species quantity on X. The Along selector defines each sample sequence. X and Y always share a state identity; lines follow sample order, retaining turns and duplicate X values. Point playback and Δ follow that sequence without merging repeated values.<br><strong>X-axis direction:</strong> choose Low → High or High → Low at the top. Every figure, tick and hover lookup follows the display direction without changing raw data, the selected sample or Y ranges. With a condition coordinate on X, left/right arrows and the point slider follow screen direction, and Δ compares the adjacent lower-X sample. With a measured quantity on X, sample navigation keeps the chosen sequence. An explicit reference overrides the Δ baseline. Condition playback has its own direction. Workspace saving and SVG export retain the direction.')}</p><p>${L('② <strong>连续浏览：</strong>底部选择温度、压力或轮次等维度，拖进度条或按 ↑ ↓ 切换整组条件。播放同样切换该维度；可反向、调速、循环。没有其他维度时，才退回“图内采样点”。','② <strong>Browse conditions:</strong> choose a dimension at the bottom, such as temperature, pressure or cycle. The main slider, ↑ ↓ and playback change that condition across every figure. Set direction, speed and looping. A single-path dataset falls back to “Sample point”.')}</p><p>${L('③ <strong>图内查看：</strong>悬停曲线显示物种、原始数值、条件和对应纵轴；重叠曲线会列出多个候选。图例悬停可单独高亮。单击图内固定采样点；← → 或细进度条移动采样点。切换条件时，条件横轴保持最近的横轴位置；数值横轴保持最近的采样顺序位置。','③ <strong>Inspect samples:</strong> hover near a curve to identify its species, raw value, condition and axis. Nearby overlapping curves are listed together. Hover a legend entry to highlight its curve. Click selects a sample. Use ← → or the smaller cursor slider. Changing conditions preserves the nearest X position for coordinate axes, or the nearest position in the chosen sample sequence for measured X quantities.')}</p><p>${L('④ <strong>比较：</strong>“叠加此条件”保留当前条件的曲线，再切换其他条件。图例可逐条隐藏。“图设置”可调高度、纵轴范围、顺序或删除；每张图可复制，宽窗口可并排。','④ <strong>Compare:</strong> pin a condition before switching to another. Click legend entries to hide individual curves. Figure settings control height, Y-range scope, order and deletion. Copy figures, or use side-by-side layout on wide windows.')}</p><p>${L('⑤ <strong>定位：</strong>右侧针对正在编辑的图寻找绝对变化、正值倍数变化或阈值区间，可扫描当前情景所有条件。结果可翻页，单击后全部图同步跳转。参考点与书签可以跨条件。收藏后按钮变为实心星号，并更新书签列表；再次点击取消。','⑤ <strong>Locate:</strong> scan a series from the active figure for absolute changes, positive fold changes or threshold crossings, optionally across all conditions in the scenario. Page through matches and click to move every figure together. References and bookmarks can span conditions. A saved point has a filled star and appears in the bookmark list; click again to remove it.')}</p><p>${L('⑥ <strong>保存：</strong>保存工作区下载一份包含当前载入数据、图、语言与位置的 HTML；保存按钮标明点数范围，未载入的轮次或点段不包含在内。原文件不变，刷新未保存的页面会丢失界面修改。SVG 包含标题、图例、条件和当前视野；CSV 输出此图当前条件的所有原始采样点。','⑥ <strong>Save:</strong> download one HTML with all currently loaded data, figures, language and position. The save button shows coverage; unloaded rounds or pages are not included. Originals stay unchanged; reloading without saving loses UI changes. SVG includes title, legend, conditions and the visible view. CSV contains all raw samples at this figure’s current condition.')}</p><hr class="section-separator"><h3>${L('尺度与叠加','Scales and overlays')}</h3><p class="note">${L('默认基准尺度：线性轴包含零，对数轴至少显示一个数量级，并在当前情景内跨条件统一。细小变化不会被自动铺满整个图；需要放大时在该图的“图设置”中选择“局部放大”，图上会明确提示。图设置可改为当前视野范围。多轴叠加便于对照变化位置，但各轴刻度独立，不能依据曲线高度或交点比较不同量的绝对数值。','Default context scale: linear axes include zero, log axes show at least one decade, and ranges stay consistent across conditions in the scenario. Small changes are not automatically expanded to fill the plot. Choose Detail scale explicitly when needed; the chart labels this magnification. Figure settings can limit the range to visible data. Multi-axis overlays align locations, but independent scales mean heights and crossings cannot compare absolute values across quantities.')}</p><h3>${L('数据与限制','Data and limits')}</h3><p class="note">${L('自动识别表中的 species、数值列和常用条件维度；不内置任何体系或元素预设。未知单位保留字段原名。自定义条件可在导入时填写。状态表没有 species 列；物种表必须含 species 和足以唯一匹配状态的匹配列。标识字符串（如 001）保持原义。','Species, numeric columns and common condition dimensions are discovered from the tables; no chemistry or element presets. Unknown units keep the raw field name. Specify custom dimensions at import. The summary has no species column. Species tables need species and join keys that uniquely identify each state. String identifiers such as 001 remain distinct.')}</p><p class="note">${L('保留双精度原值；缺失值与对数非正值不连线。相同情景的横轴采样点并集用于识别缺口；不规则路径可能显示断线，建议用步骤或记录顺序。求解失败标记 false / 0 会被排除；未导出的失败点无法恢复。全部为空、且未知含义的列不会被猜作数值列。','Double-precision values are preserved. Missing or log-incompatible values break lines. The union of sampled X values in a scenario identifies gaps; irregular paths may show breaks, so use steps or record order. Samples marked failed (false / 0) are excluded; unexported failures cannot be recovered. Unknown all-empty columns are not guessed to be numeric.')}</p><p class="note">${L('绝对变化不除以步长；倍数变化只用于正值。变化排名是导航辅助，不代表科学显著性或精确相界。本工具不检验原模型、不调用求解器、不自动监控 Notebook。重算后重新打开导出的结果。大规模数据受浏览器内存与绘图数量限制。','Absolute changes are not divided by step size; fold changes require positive values. Rankings aid navigation, not scientific significance or exact phase boundaries. This tool does not validate the model, call a solver, or watch a notebook. Reopen exported results after a new run. Large datasets are limited by browser memory and figure count.')}</p><details><summary>${L('Notebook 接入：不需要额外 Python 模块','Notebook integration: no extra Python module')}</summary><p class="note">${L('已有 CSV 时直接打开，无需运行下面代码。如需从内存中的 DataFrame 导出，修改变量名后运行，再用“打开结果”选择 JSON。此代码不调用 Reaktoro；文件存在时会停止以防覆盖。','Open existing CSV files directly. To export in-memory DataFrames, adapt the variable names below, run it and open the JSON using Open results. It does not call Reaktoro and refuses to overwrite existing files.')}</p><pre id="notebook-code">${esc(notebookCode)}</pre><button id="copy-notebook" class="small">${L('复制代码','Copy code')}</button></details><p class="note">Result Explorer for Reaktoro 2.2 · ${L('单文件 · 离线 · 本地只读 · 中文 / English','Single file · offline · local read-only · 中文 / English')}</p>`;showDialog('help-dialog');

 if(!model||document.querySelector('.workspace')?.hidden||document.querySelector('dialog[open]')||e.altKey||e.ctrlKey||e.metaKey||e.target.closest('[role="separator"]'))return;
 const tag=e.target.tagName,isRange=tag==='INPUT'&&e.target.type==='range';
 if((['INPUT','SELECT','TEXTAREA'].includes(tag)&&!isRange)||e.target.isContentEditable)return;
 if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)){e.preventDefault();stop();if(e.key==='ArrowLeft'||e.key==='ArrowRight')movePointOnScreen(e.key==='ArrowRight'?1:-1);else moveBrowse(e.key==='ArrowDown'?1:-1);}
 else if(e.code==='Space'&&tag!=='BUTTON'){e.preventDefault();play();}
},true);
const navigationButtons=new Set(['previous-condition','next-condition','previous-point','next-point']);
let heldNavigation=null,heldClick=null;
function endHeldNavigation(){if(heldNavigation){clearTimeout(heldNavigation.timer);heldNavigation=null;}}
function consumeHeldClick(id){if(heldClick?.id===id&&Date.now()<heldClick.until){heldClick=null;return true;}return false;}
function navigationStep(id){stop();if(id.endsWith('condition'))moveBrowse(id.startsWith('next')?1:-1);else movePointOnScreen(id.startsWith('next')?1:-1);}
document.addEventListener('pointerdown',e=>{heldClick=null;const button=e.target.closest('button');if(!model||!button||button.disabled||!navigationButtons.has(button.id)||e.button>0)return;
 endHeldNavigation();const id=button.id;heldClick={id,until:Date.now()+1200};navigationStep(id);const hold={id,timer:null};heldNavigation=hold;
 const repeat=()=>{if(heldNavigation!==hold||$(id)?.disabled||document.hidden){endHeldNavigation();return;}heldClick={id,until:Date.now()+1200};navigationStep(id);hold.timer=setTimeout(repeat,85);};hold.timer=setTimeout(repeat,350);
});
for(const event of ['pointerup','pointercancel'])document.addEventListener(event,()=>{if(heldNavigation)heldClick={id:heldNavigation.id,until:Date.now()+700};endHeldNavigation();});
document.addEventListener('pointerout',e=>{if(heldNavigation&&e.target.closest('button')?.id===heldNavigation.id&&!$(heldNavigation.id)?.contains(e.relatedTarget))endHeldNavigation();});

function pointerInfo(e){const hit=e.target.closest('.hit-area');if(!hit||!slice.length)return null;const spec=plotSpecs[Number(hit.dataset.plot)],svg=hit.closest('svg'),box=svg.getBoundingClientRect(),px=(e.clientX-box.x)/box.width*spec.W,py=(e.clientY-box.y)/box.height*spec.H,f=(px-spec.L)/(spec.W-spec.L-spec.R),t=spec.reversed?1-f:f,x=spec.xLog?10**((1-t)*spec.txlo+t*spec.txhi):(1-t)*spec.xlo+t*spec.xhi;const p={spec,svg,px,py,x,id:slice[nearestIndex(slice,x)]};if(sampleOrder()||spec.scatter||state.plotScope==='all'){const hit=curveHits(p)[0];if(hit)p.id=hit.id;else return null;}return p;}
function clearCurveHover(){hoverCurve=null;const tip=$('curve-tooltip');if(tip)tip.classList.add('hide');document.querySelectorAll('.series-layer.dimmed,.series-layer.highlighted').forEach(e=>{e.classList.remove('dimmed','highlighted');});}
function highlightCurves(gi,ids){document.querySelectorAll('.series-layer').forEach(e=>{const here=e.closest('svg').dataset.gi===String(gi);e.classList.toggle('highlighted',here&&ids.includes(e.dataset.seriesCurve));e.classList.toggle('dimmed',here&&!ids.includes(e.dataset.seriesCurve));});}
function lowerBound(values,x){let lo=0,hi=values.length;while(lo<hi){const m=(lo+hi)>>1;if(values[m]<x)lo=m+1;else hi=m;}return lo;}
function curveHits(p){
 if(p.spec.duplicates)return [];const spec=p.spec,tol=10,dx=(spec.xhi-spec.xlo)/(spec.W-spec.L-spec.R)*tol,lo=Math.max(0,lowerBound(domain,p.x-dx)-1),hi=Math.min(domain.length-1,lowerBound(domain,p.x+dx)+1),out=[];
 for(const s of spec.paths){if(!s.coords.size)continue;let best=null;
  const consider=(distance,id)=>{if(distance<=tol&&(!best||distance<best.distance))best={distance,id,path:s};};
  const keys=[...s.coords.keys()];
  for(const j of keys){const a=s.coords.get(j);if(!a||a.x<spec.L||a.x>spec.W-spec.R||a.y<spec.T||a.y>spec.H-spec.B)continue;consider(Math.hypot(p.px-a.x,p.py-a.y),a.id);const b=s.coords.get(j+1);if(spec.scatter||!b||p.px<Math.min(a.x,b.x)-tol||p.px>Math.max(a.x,b.x)+tol)continue;const len=Math.hypot(b.x-a.x,b.y-a.y);if(!len)continue;const ux=(b.x-a.x)/len,uy=(b.y-a.y)/len,t=clamp((p.px-a.x)*ux+(p.py-a.y)*uy,0,len);consider(Math.hypot(p.px-a.x-t*ux,p.py-a.y-t*uy),t/len>.5?b.id:a.id);}
  if(best)out.push(best);

}
function showCurveTooltip(p,e){
 const hits=curveHits(p);if(!hits.length){clearCurveHover();return;}const shown=hits.slice(0,6);highlightCurves(p.spec.gi,shown.map(h=>h.path.curveId));hoverCurve={chartId:p.spec.chartId,gi:p.spec.gi,matches:hits.map(h=>({id:h.id,curveId:h.path.curveId,name:h.path.name,key:h.path.key,value:h.path.values[h.id],pathLabel:h.path.pathLabel,axis:h.path.axis.tag}))};
 const tip=$('curve-tooltip');tip.innerHTML=(hits.length>1?`<div class="note">${L('此处附近曲线','Nearby curves')}: ${hits.length}${hits.length>shown.length?' · '+L('显示前 6 条','showing first 6'):''}</div>`:'')+shown.map(h=>{const s=h.path,point=model.points[h.id];return `<div class="hover-entry"><strong style="color:${s.color}">${esc(seriesName(s))}</strong><div class="note">${esc((s.axis.tag?s.axis.tag+' · ':'')+withUnit(s.key))}${s.phase?' · '+esc(s.phase):''} · ${esc(s.pathLabel)}</div><div class="number">${esc(nice(s.values[h.id],10))} <span class="unit">${esc(s.unit)}</span></div><div class="note">${L('附近采样点','Nearby saved sample')}: ${esc(label(state.axis))} ${esc(nice(xValue(h.id)))} ${esc(unit(state.axis))}</div></div>`;}).join('');tip.classList.remove('hide');
 let left=e.clientX+15,top=e.clientY+15;tip.style.left='0px';tip.style.top='0px';const box=tip.getBoundingClientRect();if(left+box.width>innerWidth-8)left=e.clientX-box.width-15;if(top+box.height>innerHeight-8)top=e.clientY-box.height-15;tip.style.left=Math.max(8,left)+'px';tip.style.top=Math.max(8,top)+'px';
}
document.addEventListener('pointermove',e=>{

 if(legend){if(pointerFrame)cancelAnimationFrame(pointerFrame);pointerFrame=null;hovering=null;hoverCurve=null;$('curve-tooltip').classList.add('hide');highlightCurves(Number(legend.dataset.gi),[legend.dataset.legend]);updatePoint();return;}

async function boot(){
